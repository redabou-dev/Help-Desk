<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- font Awesome -->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <!-- responsive -->
    <link rel="stylesheet" href="css/responsive.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- css -->

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="logo">
        <p><i class="fa-solid fa-square-h"></i></p>
        <p class="title">HelpDesk</p>
      </div>
      <nav>
        <p class="menue"><i class="fa-solid fa-bars"></i></p>
      </nav>
    </header>
    <main>
      <div class="paragraphs">
        <h1>Gestion des demandes</h1>
        <p class="suivez">Suivez et gérez les incidents informatiques.</p>
      </div>

      <!-- formulair -->
      <form action="" id="demande-form">
        <h3 class="form-title">Créer une demande</h3>
        <p class="form-description">Décrivez votre problème informatique.</p>
        <div class="all-input">
          <div class="input">
            <label for="titre">Titre du problème *</label>
            <input
              type="text"
              required
              placeholder="Connexion Wi-Fi instable"
              id="titre"
            />
            <p class="error" id="error-title"></p>
          </div>
          <div class="input">
            <label for="categorie">Catégorie *</label>
            <select class="select" name="" id="categorie">
              <option value="" disabled selected>Choisir une catégorie</option>
              <option value="Reseau">Reseau</option>
              <option value="Matériel">Matériel</option>
              <option value="Logiciel">Logiciel</option>
            </select>
            <p class="error" id="error-categorie"></p>
          </div>
          <div class="input">
            <label for="priorite">Priorité *</label>
            <select class="select" name="" id="priorite">
               <option value="" disabled selected>Choisir une priorite</option>
                    <option value="Basse">Basse</option>
                     <option value="Normale">Normale</option>
              <option value="Haute">Haute</option>
            </select>
            <p class="error" id="error-priorite"></p>
          </div>
          <div class="aria">
            <label for="description">Description *</label>
            <textarea
              class="area"
              name=""
              id="description"
              rows="2"
              placeholder="Décrivez votre problème..."
            ></textarea>
          </div>
        </div>

        <div class="submit">
          <input id="btn" type="submit" value="＋  Ajouter la demande"  />
        </div>
      </form>
      <section class = "list-section">
        <div class="list-entete">
            <h3 class="list">Liste des demandes</h3>
            <span class="compteur" id="compteurr"> demandes</span>
        </div>
        <p class = "vide" id="vide"></p>
        <div class="liste" id="liste">
            <!-- we use this container to storage cards with js -->
             
        </div>
      </section>
    </main>

    <script src="js/scripte.js"></script>
  </body>
</html>
